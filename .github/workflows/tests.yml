name: Tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    all-tests:
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@master
            - uses: oven-sh/setup-bun@v2

            - name: Install node modules
              run: bun install --frozen-lockfile

            - name: Format project
              run: |
                  bunx @biomejs/biome format
                  bunx prettier --check ./src/scss
                  bunx prettier --check ./src/svg

            - name: Assert types
              run: bunx tsc

            - name: Lint project
              run: |
                  bunx @biomejs/biome lint
                  bunx eslint .
                  bunx stylelint **/*.css **/*.scss
